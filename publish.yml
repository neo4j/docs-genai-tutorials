# Use this playbook file when you need to build and publish multuple versions of your content together
site:
  title: Neo4j GenAI Tutorials
  url: https://neo4j.com/docs/genai/
  #start_page: tutorials:embeddings-vector-indexes:index.adoc

content:
  sources:
  - url: ./
    branches: ['cypher-5', 'HEAD']
    edit_url: https://github.com/neo4j/docs-genai-tutorials/tree/dev/{path}
    exclude:
    - '!**/_includes/*'
    - '!**/readme.adoc'
    - '!**/README.adoc'

ui:
  bundle:
    url: https://static-content.neo4j.com/build/ui-bundle.zip
    snapshot: true
  output_dir: /assets

urls:
  html_extension_style: indexify

antora:
  extensions:
  - "@neo4j-antora/roles-labels"
  - "@neo4j-antora/table-footnotes"

asciidoc:
  extensions:
  - "@neo4j-documentation/remote-include"
  - "@neo4j-documentation/macros"
  - "@neo4j-antora/antora-add-notes"
  - "@neo4j-antora/mark-terms"
  attributes:
    page-theme: docs
    page-type: Docs
    page-search-type: Docs
    page-search-site: Reference Docs
    page-canonical-root: /docs
    page-pagination: true
    page-no-canonical: true
    page-origin-private: false
    page-hide-toc: false
    page-mixpanel: 4bfb2414ab973c741b6f067bf06d5575
    page-cdn: https://neo4j.com/docs/assets  # needed for UI assets to be loaded
    includePDF: false
    nonhtmloutput: ""
    experimental: ''
    copyright: "2025 Neo4j, Inc."
    common-license-page-uri: https://neo4j.com/docs/license/
    docs-base-uri: https://neo4j.com/docs
    check-mark: icon:check[]
    cross-mark: icon:times[]
    neo4j-base-uri: ''
    neo4j-docs-base-uri: /docs
    table-caption:
    partials: embeddings-vector-indexes:partial$@
    # NODES 2026 registration (Remove after November 12)
    #
    page-ad-overline-link: ''
    page-ad-overline: ''
    page-ad-icon: ''
    page-ad-image: "{neo4j-docs-base-uri}/assets/img/nodes-26.png"
    page-ad-title: Neo4j Online Developer Conference
    page-ad-description: Join us on November 12 for live and unique tech talks over 24 hours across all timezones
    page-ad-link: https://neo4j.com/nodes/
    page-ad-underline-role: button
    page-ad-underline: Register
